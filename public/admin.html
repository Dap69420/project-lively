<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/vektra-logo-bg.png">
    <title>Vektra - Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <script src="/api/config"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils/supabase.js"></script>
    <link rel="stylesheet" href="theme-global.css">
    <script src="theme-bootstrap.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonViolet: '#b026ff',
                        lime: '#ccff00',
                        hotpink: '#ff00ff',
                        dark: '#111111',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a2e 100%);
            background-attachment: fixed;
        }

        @layer components {
            .glass-panel {
                @apply bg-glassBg border border-glassBorder backdrop-blur-xl rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.3)] transition-all duration-300;
            }
        }

        .theme-brutal {
            background-color: #111111 !important;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 1px, transparent 1px) !important;
            background-size: 24px 24px !important;
            color: #ffffff !important;
        }

        .theme-brutal > .fixed {
            display: none !important;
        }

        .theme-brutal .glass-panel {
            backdrop-filter: none;
            background: #111111 !important;
            color: #ffffff !important;
            border: 4px solid #ffffff !important;
            border-radius: 0 !important;
            box-shadow: 8px 8px 0 #ccff00 !important;
        }

        .theme-brutal input,
        .theme-brutal select,
        .theme-brutal textarea {
            background: #fff !important;
            color: #111 !important;
            border: 4px solid #111 !important;
            border-radius: 0 !important;
            box-shadow: 4px 4px 0 #ff00ff !important;
        }

        .theme-brutal input::placeholder,
        .theme-brutal textarea::placeholder {
            color: #555 !important;
        }

        .theme-brutal button {
            border-radius: 0 !important;
        }

        .theme-brutal button,
        .theme-brutal a.bg-neonViolet,
        .theme-brutal .bg-neonViolet {
            background: #ccff00 !important;
            color: #111111 !important;
            border: 4px solid #111111 !important;
            box-shadow: 6px 6px 0 #ff00ff !important;
            text-transform: uppercase;
        }

        .theme-brutal button.bg-black\/30 {
            background: #111111 !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
            box-shadow: 4px 4px 0 #ccff00 !important;
        }

        .theme-brutal button:hover,
        .theme-brutal a.bg-neonViolet:hover {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0 #ff00ff !important;
        }

        .theme-brutal button:active,
        .theme-brutal a.bg-neonViolet:active {
            transform: translate(6px, 6px);
            box-shadow: none !important;
        }

        .theme-brutal .bg-darkBg {
            background: #111111 !important;
        }

        .theme-brutal .text-neonViolet,
        .theme-brutal .text-purple-400 {
            color: #ccff00 !important;
        }

        .theme-brutal .text-blue-400,
        .theme-brutal .text-green-400 {
            color: #ff00ff !important;
        }

        .theme-brutal .text-gray-400,
        .theme-brutal .text-gray-300 {
            color: #e5e7eb !important;
        }

        .theme-brutal .bg-black\/20,
        .theme-brutal .bg-white\/5,
        .theme-brutal .bg-white\/10 {
            background: #1f1f1f !important;
        }

        .theme-brutal .border-white\/10,
        .theme-brutal .border-white\/20,
        .theme-brutal .border-neonViolet,
        .theme-brutal .hover\:border-neonViolet\/50:hover {
            border-color: #ffffff !important;
        }

        .theme-brutal .rounded,
        .theme-brutal .rounded-lg,
        .theme-brutal .rounded-xl,
        .theme-brutal .rounded-2xl {
            border-radius: 0 !important;
        }

        .theme-brutal .shadow-\[0_0_20px_rgba\(176\,38\,255\,0\.4\)\] {
            box-shadow: 6px 6px 0 #ff00ff !important;
        }
    </style>
</head>
<body class="text-white font-sans">
    <div id="root"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/admin/CourseForm.js"></script>
    <script type="text/babel" src="admin-app.js"></script>
</body>
</html>
