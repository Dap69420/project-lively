<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/vektra-logo-bg.png">
    <title>Vektra - User Evolution</title>
    <meta name="description" content="Track your learning evolution and skills.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <script src="/api/config"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils/progression.js"></script>
    <script src="utils/supabase.js"></script>
    <link rel="stylesheet" href="theme-global.css">
    <script src="theme-bootstrap.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lime: '#ccff00',
                        hotpink: '#ff00ff',
                        dark: '#111111',
                        neonViolet: '#b026ff',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        html,
        body,
        #root {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }
        body {
            @apply font-sans antialiased overflow-x-hidden min-h-screen;
        }
        body.theme-glass {
            @apply bg-darkBg text-white;
        }
        body.theme-brutal {
            @apply bg-dark text-white;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 1px, transparent 1px) !important;
            background-size: 24px 24px !important;
        }
    }
    
    /* Cross-Theme Overrides */
    body.theme-brutal .glass-panel {
        background: #111111 !important;
        border: 4px solid #ffffff !important;
        padding: 1.5rem !important;
        border-radius: 0 !important;
        backdrop-filter: none !important;
        box-shadow: 0 0 0 4px #ccff00, 8px 8px 0 #ccff00 !important;
    }
    body.theme-brutal .profile-hero {
        box-shadow: 0 0 0 4px #ccff00, 8px 8px 0 #ccff00 !important;
    }
    body.theme-brutal .neon-text { color: #ccff00 !important; text-shadow: none !important; }
    body.theme-brutal .text-neonViolet { color: #ccff00 !important; }
    body.theme-brutal .bg-neonViolet { background: #ccff00 !important; color: #111111 !important; }
    body.theme-brutal .border-neonViolet { border-color: #ccff00 !important; }
    body.theme-brutal .shadow-\[0_0_15px_rgba\(176\,38\,255\,0\.4\)\] { box-shadow: 4px 4px 0px #ccff00 !important; }
    body.theme-brutal .shadow-\[0_0_12px_\#b026ff\] { box-shadow: 4px 4px 0px #ccff00 !important; }
    body.theme-brutal .bg-glow { display: none !important; }

    @media (max-width: 640px) {
        body.theme-brutal .glass-panel {
            border-width: 2px !important;
            padding: 1rem !important;
            box-shadow: 0 0 0 3px #ccff00, 4px 4px 0 #ccff00 !important;
        }
        body.theme-brutal .profile-hero {
            box-shadow: 0 0 0 3px #ccff00, 4px 4px 0 #ccff00 !important;
        }
    }

    @layer components {
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 300ms;
            max-width: 100%;
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }
        .neon-text {
            color: #b026ff;
            text-shadow: 0 0 12px rgba(176, 38, 255, 0.6);
        }
        .neon-border {
            border-color: #b026ff;
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(176, 38, 255, 0.5); 
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(176, 38, 255, 0.8); 
        }
        .field {
            @apply w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-white outline-none focus:border-neonViolet;
        }
    }

    /* Animation Reduction & Extra Keyframes */
    body.animations-reduced *,
    body.animations-reduced ::before,
    body.animations-reduced ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/profile/AvatarSection.js"></script>
    <script type="text/babel" src="components/profile/CourseSelector.js"></script>
    <script type="text/babel" src="components/profile/StatsGrid.js"></script>
    <script type="text/babel" src="components/profile/SkillTree.js"></script>
    <script type="text/babel" src="components/profile/RecentBadges.js"></script>
    <script type="text/babel" src="components/profile/ParentDashboard.js"></script>
    <script type="text/babel" src="components/profile/EducatorDashboard.js"></script>
    <script type="text/babel" src="profile-app.js"></script>
</body>
</html>
