<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Lively - Founder's Lab</title>
    <meta name="description" content="Built from the ground up, under the radar. Support Project Lively.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@700&display=swap" rel="stylesheet">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="theme-global.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lime: '#ccff00',
                        hotpink: '#ff00ff',
                        dark: '#111111',
                        neonViolet: '#b026ff',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        handwriting: ['"Caveat"', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            @apply font-sans antialiased min-h-screen flex flex-col;
        }
        body.theme-brutal {
            @apply bg-dark text-white;
        }
        body.theme-glass {
            @apply bg-darkBg text-white;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-bold tracking-tight;
        }
    }
    
    /* GLASS Mode: Rounded, modern, smooth */
    body.theme-glass .brutal-card {
        @apply bg-glassBg border border-glassBorder backdrop-blur-xl rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.3)] !important;
    }
    body.theme-glass .brutal-btn-lime {
        @apply bg-neonViolet text-white border border-white/20 rounded-lg shadow-[0_0_15px_rgba(176,38,255,0.4)] px-6 py-3 transition-all hover:bg-white/10 hover:translate-x-0 hover:translate-y-0 !important;
    }
    body.theme-glass .text-lime { @apply text-neonViolet !important; }
    body.theme-glass .border-4 { @apply border border-white/10 !important; }
    body.theme-glass .circuit-bg {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b026ff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    body.theme-glass [class*="rounded-none"] {
        @apply rounded-2xl !important;
    }

    /* BRUTAL Mode: Sharp edges, hard shadows, pixelated */
    body.theme-brutal .circuit-bg {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ccff00' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    body.theme-brutal .glass-panel,
    body.theme-brutal .brutal-card,
    body.theme-brutal [class*="rounded-2xl"],
    body.theme-brutal [class*="rounded-xl"],
    body.theme-brutal [class*="rounded-lg"] {
        @apply rounded-none !important;
    }
    body.theme-brutal .glass-panel {
        @apply bg-dark border-4 border-white p-6 shadow-[8px_8px_0px_#ccff00] rounded-none backdrop-blur-none !important;
    }
    body.theme-brutal .bg-glow {
        @apply hidden !important;
    }

    @layer components {
        .brutal-card {
            @apply bg-dark border-4 border-white p-6 shadow-[8px_8px_0px_#ccff00] rounded-none relative overflow-hidden transition-all duration-300;
        }
        .brutal-btn-lime {
            @apply bg-lime text-black font-bold uppercase border-4 border-black px-6 py-3 shadow-[6px_6px_0px_#ff00ff] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[4px_4px_0px_#ff00ff] active:translate-x-[6px] active:translate-y-[6px] active:shadow-none transition-all;
        }
    }

    /* Animation Reduction & Extra Keyframes */
    body.animations-reduced *,
    body.animations-reduced ::before,
    body.animations-reduced ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .animate-float {
        animation: float 4s ease-in-out infinite;
    }
    @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>
</head>
<body class="circuit-bg">
    <div id="root" class="flex-grow flex flex-col"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/founders/TheStory.js"></script>
    <script type="text/babel" src="components/founders/TheVision.js"></script>
    <script type="text/babel" src="components/founders/SupportCard.js"></script>
    <script type="text/babel" src="components/founders/ContactGrid.js"></script>
    <script type="text/babel" src="founders-app.js"></script>
</body>
</html>
