<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/vektra-logo-bg.png">
    <title>Vektra - Founder's Lab</title>
    <meta name="description" content="Built from the ground up, under the radar. Support Vektra.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@700&display=swap" rel="stylesheet">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link rel="stylesheet" href="theme-global.css">
    <script src="theme-bootstrap.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lime: '#ccff00',
                        hotpink: '#ff00ff',
                        dark: '#111111',
                        neonViolet: '#b026ff',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        handwriting: ['"Caveat"', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            font-family: "Space Grotesk", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body.theme-brutal {
            background: #111111;
            color: #ffffff;
        }
        body.theme-glass {
            background: #0a0a0f;
            color: #ffffff;
        }
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.02em;
        }
    }
    
    /* Cross-Theme Overrides */
    body.theme-glass .brutal-card {
        background: rgba(255,255,255,0.03) !important;
        border: 1px solid rgba(255,255,255,0.08) !important;
        backdrop-filter: blur(18px);
        border-radius: 1rem !important;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3) !important;
    }
    body.theme-glass .brutal-btn-lime {
        background: #b026ff !important;
        color: #ffffff !important;
        border: 1px solid rgba(255,255,255,0.2) !important;
        border-radius: 0.5rem !important;
        box-shadow: 0 0 15px rgba(176,38,255,0.4) !important;
        padding: 0.75rem 1.5rem !important;
    }
    body.theme-glass .text-lime { color: #b026ff !important; }
    body.theme-glass .border-4 { border-color: rgba(255,255,255,0.1) !important; }
    body.theme-glass .circuit-bg {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b026ff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    body.theme-brutal .circuit-bg {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ccff00' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    body.theme-brutal .glass-panel {
        background: #111111 !important;
        border: 4px solid #ffffff !important;
        padding: 1.5rem !important;
        box-shadow: 8px 8px 0px #ccff00 !important;
        border-radius: 0 !important;
        backdrop-filter: none !important;
    }
    body.theme-brutal .bg-glow {
        display: none !important;
    }

    @layer components {
        .brutal-card {
            background: #111111;
            border: 4px solid #ffffff;
            padding: 1.5rem;
            box-shadow: 8px 8px 0px #ccff00;
            border-radius: 0;
            position: relative;
            overflow: hidden;
            transition: all 300ms ease;
        }
        .brutal-btn-lime {
            background: #ccff00;
            color: #000000;
            font-weight: 700;
            text-transform: uppercase;
            border: 4px solid #000000;
            padding: 0.75rem 1.5rem;
            box-shadow: 6px 6px 0px #ff00ff;
            transition: all 150ms ease;
        }
    }

    /* Animation Reduction & Extra Keyframes */
    body.animations-reduced *,
    body.animations-reduced ::before,
    body.animations-reduced ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .animate-float {
        animation: float 4s ease-in-out infinite;
    }
    @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>
</head>
<body class="circuit-bg">
    <div id="root" class="flex-grow flex flex-col"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/founders/TheStory.js"></script>
    <script type="text/babel" src="components/founders/TheVision.js"></script>
    <script type="text/babel" src="components/founders/SupportCard.js"></script>
    <script type="text/babel" src="components/founders/ContactGrid.js"></script>
    <script type="text/babel" src="founders-app.js"></script>
</body>
</html>
