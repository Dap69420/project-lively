<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/vektra-logo-bg.png">
    <title>Vektra - AI Study Partner</title>
    <meta name="description" content="Meet the first AI that doesn't just grade you—it studies with you.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <script src="/api/config"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils/progression.js"></script>
    <script src="utils/supabase.js"></script>
    <link rel="stylesheet" href="theme-global.css">
    <script src="theme-bootstrap.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lime: '#ccff00',
                        hotpink: '#ff00ff',
                        dark: '#111111',
                        neonViolet: '#b026ff',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            font-family: "Space Grotesk", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }
        body.theme-brutal {
            background: #111111;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 1px, transparent 1px) !important;
            background-size: 24px 24px !important;
        }
        body.theme-glass {
            background: #0a0a0f;
            color: #ffffff;
            background-image: none !important;
        }
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
    }
    
    /* Cross-Theme Overrides */
    body.theme-glass .brutal-card {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        backdrop-filter: blur(18px);
        border-radius: 1rem !important;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3) !important;
    }
    body.theme-glass .brutal-btn-lime {
        background: #b026ff !important;
        color: #ffffff !important;
        border: 1px solid rgba(255,255,255,0.2) !important;
        border-radius: 0.5rem !important;
        box-shadow: 0 0 15px rgba(176,38,255,0.4) !important;
        padding: 0.75rem 1.5rem !important;
        transition: all 150ms ease !important;
    }
    body.theme-glass .brutal-btn-pink {
        background: #2563eb !important;
        color: #ffffff !important;
        border: 1px solid rgba(255,255,255,0.2) !important;
        border-radius: 0.5rem !important;
        box-shadow: 0 0 15px rgba(37,99,235,0.4) !important;
        padding: 0.75rem 1.5rem !important;
        transition: all 150ms ease !important;
    }
    body.theme-glass .text-lime { color: #b026ff !important; }
    body.theme-glass .text-hotpink { color: #60a5fa !important; }
    body.theme-glass .border-4 { border-color: rgba(255,255,255,0.1) !important; }
    body.theme-glass .bg-lime { background: rgba(176,38,255,0.2) !important; border-color: #b026ff !important; color: #b026ff !important; }
    body.theme-glass .bg-hotpink { background: rgba(37,99,235,0.2) !important; border-color: #2563eb !important; color: #60a5fa !important; }
    
    /* Brutal specific overrides for glass components */
    body.theme-brutal .glass-panel {
        background: #111111 !important;
        border: 4px solid #ffffff !important;
        padding: 1.5rem !important;
        box-shadow: 8px 8px 0px #ccff00 !important;
        border-radius: 0 !important;
        backdrop-filter: none !important;
    }
    body.theme-brutal .bg-glow {
        display: none !important;
    }

    @layer components {
        .brutal-card {
            background: #111111;
            border: 4px solid #ffffff;
            padding: 1.5rem;
            box-shadow: 8px 8px 0px #ccff00;
            border-radius: 0;
            position: relative;
            overflow: hidden;
            transition: all 300ms ease;
        }
        .brutal-card-pink {
            box-shadow: 8px 8px 0px #ff00ff;
            border-color: #ccff00;
        }
        .brutal-btn-lime {
            background: #ccff00;
            color: #000000;
            font-weight: 700;
            text-transform: uppercase;
            border: 4px solid #000000;
            padding: 0.75rem 1.5rem;
            box-shadow: 6px 6px 0px #ff00ff;
            transition: all 150ms ease;
        }
        .brutal-btn-pink {
            background: #ff00ff;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            border: 4px solid #ffffff;
            padding: 0.75rem 1.5rem;
            box-shadow: 6px 6px 0px #ccff00;
            transition: all 150ms ease;
        }
        .brutal-badge {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border: 2px solid #000000;
            font-size: 0.875rem;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px #ff00ff;
        }
    }

    /* Animation Reduction & Extra Keyframes */
    body.animations-reduced *,
    body.animations-reduced ::before,
    body.animations-reduced ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .animate-float {
        animation: float 4s ease-in-out infinite;
    }
    @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>

</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/Hero.js"></script>
    <script type="text/babel" src="components/Roadmap.js"></script>
    <script type="text/babel" src="components/Features.js"></script>
    <script type="text/babel" src="components/Donation.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
