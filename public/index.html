<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Lively - AI Study Partner</title>
    <meta name="description" content="Meet the first AI that doesn't just grade you—it studies with you.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <script src="/api/config"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils/progression.js"></script>
    <script src="utils/supabase.js"></script>
    <link rel="stylesheet" href="theme-global.css">
    <script src="theme-bootstrap.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lime: '#ccff00',
                        hotpink: '#ff00ff',
                        dark: '#111111',
                        neonViolet: '#b026ff',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            @apply font-sans antialiased min-h-screen;
        }
        body.theme-brutal {
            @apply bg-dark text-white;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 1px, transparent 1px) !important;
            background-size: 24px 24px !important;
        }
        body.theme-glass {
            @apply bg-darkBg text-white;
            background-image: none !important;
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-bold uppercase tracking-tight;
        }
    }
    
    /* Cross-Theme Overrides */
    body.theme-glass .brutal-card {
        @apply bg-glassBg border border-glassBorder backdrop-blur-xl rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.3)] !important;
    }
    body.theme-glass .brutal-btn-lime {
        @apply bg-neonViolet text-white border border-white/20 rounded-lg shadow-[0_0_15px_rgba(176,38,255,0.4)] px-6 py-3 transition-all hover:bg-white/10 hover:translate-x-0 hover:translate-y-0 !important;
    }
    body.theme-glass .brutal-btn-pink {
        @apply bg-blue-600 text-white border border-white/20 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.4)] px-6 py-3 transition-all hover:bg-white/10 hover:translate-x-0 hover:translate-y-0 !important;
    }
    body.theme-glass .text-lime { @apply text-neonViolet !important; }
    body.theme-glass .text-hotpink { @apply text-blue-400 !important; }
    body.theme-glass .border-4 { @apply border border-white/10 !important; }
    body.theme-glass .bg-lime { @apply bg-neonViolet/20 border-neonViolet text-neonViolet !important; }
    body.theme-glass .bg-hotpink { @apply bg-blue-500/20 border-blue-500 text-blue-400 !important; }
    
    /* Brutal specific overrides for glass components */
    body.theme-brutal .glass-panel {
        @apply bg-dark border-4 border-white p-6 shadow-[8px_8px_0px_#ccff00] rounded-none backdrop-blur-none !important;
    }
    body.theme-brutal .bg-glow {
        @apply hidden !important;
    }

    @layer components {
        .brutal-card {
            @apply bg-dark border-4 border-white p-6 shadow-[8px_8px_0px_#ccff00] rounded-none relative overflow-hidden transition-all duration-300;
        }
        .brutal-card-pink {
            @apply shadow-[8px_8px_0px_#ff00ff] border-lime;
        }
        .brutal-btn-lime {
            @apply bg-lime text-black font-bold uppercase border-4 border-black px-6 py-3 shadow-[6px_6px_0px_#ff00ff] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[4px_4px_0px_#ff00ff] active:translate-x-[6px] active:translate-y-[6px] active:shadow-none transition-all;
        }
        .brutal-btn-pink {
            @apply bg-hotpink text-white font-bold uppercase border-4 border-white px-6 py-3 shadow-[6px_6px_0px_#ccff00] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[4px_4px_0px_#ccff00] active:translate-x-[6px] active:translate-y-[6px] active:shadow-none transition-all;
        }
        .brutal-badge {
            @apply inline-block bg-white text-black font-bold px-3 py-1 border-2 border-black text-sm uppercase shadow-[2px_2px_0px_#ff00ff];
        }
    }

    /* Animation Reduction & Extra Keyframes */
    body.animations-reduced *,
    body.animations-reduced ::before,
    body.animations-reduced ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .animate-float {
        animation: float 4s ease-in-out infinite;
    }
    @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>

</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/Hero.js"></script>
    <script type="text/babel" src="components/Roadmap.js"></script>
    <script type="text/babel" src="components/Features.js"></script>
    <script type="text/babel" src="components/Donation.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
