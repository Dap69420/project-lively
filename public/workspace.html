<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Your AI Study Partner Workspace">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <script src="/api/config"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="utils/progression.js"></script>
    <script src="utils/supabase.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="theme-global.css">
    <script src="theme-bootstrap.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        discordDark: '#313338',
                        discordDarker: '#2b2d31',
                        discordDarkest: '#1e1f22',
                        mcGreen: '#55FF55',
                        mcOrange: '#FFAA00',
                        mcPurple: '#AA00AA',
                        lime: '#ccff00',
                        neonViolet: '#b026ff',
                        darkBg: '#0a0a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        pixel: ['"VT323"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
    @layer base {
        body {
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            height: 100vh;
        }
        body.theme-brutal {
            background: #1e1f22;
            color: #e5e7eb;
        }
        body.theme-glass {
            background: #0a0a0f;
            color: #e5e7eb;
        }
    }
    
    /* Cross-Theme Overrides */
    body.theme-glass .bg-discordDarkest { background: #0a0a0f !important; }
    body.theme-glass .bg-discordDarker { background: rgba(255, 255, 255, 0.03) !important; backdrop-filter: blur(18px); border-color: rgba(255, 255, 255, 0.08) !important; }
    body.theme-glass .bg-\[\#313338\] { background: #0a0a0f !important; }
    body.theme-glass .border-gray-700 { border-color: rgba(255, 255, 255, 0.10) !important; }
    body.theme-glass .text-mcGreen { color: #b026ff !important; }
    body.theme-glass .bg-mcGreen { background: #b026ff !important; color: #ffffff !important; }
    body.theme-glass .text-mcPurple { color: #60a5fa !important; }
    body.theme-glass .bg-mcPurple { background: #3b82f6 !important; }
    body.theme-glass .comic-card {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        backdrop-filter: blur(18px);
        border-radius: 1rem !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3) !important;
        color: #ffffff !important;
    }
    
    body.theme-brutal .glass-panel {
        background: #2b2d31 !important;
        border: 2px solid #4e5058 !important;
        border-radius: 0 !important;
        box-shadow: 8px 8px 0px #ccff00 !important;
        backdrop-filter: none !important;
    }
    body.theme-brutal .bg-glow {
        display: none !important;
    }

    @layer components {
        .panel {
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #2b2d31;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
        }
        .pixel-btn {
            font-family: "VT323", monospace;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-bottom: 4px solid currentColor;
            transition: all 150ms ease;
        }
        .pixel-btn:active {
            border-bottom-width: 0;
            transform: translateY(0.25rem);
        }
        .comic-card {
            background: #ffffff;
            color: #000000;
            border-radius: 0.5rem;
            border: 4px solid #000000;
            padding: 1rem;
            position: relative;
            overflow: hidden;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e1f22; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4e5058; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6d6f78; 
        }
    }

    /* Animation Reduction & Extra Keyframes */
    body.animations-reduced *,
    body.animations-reduced ::before,
    body.animations-reduced ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px) rotate(-2deg); }
    }
    .animate-float {
        animation: float 4s ease-in-out infinite;
    }
    @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/ThemeToggle.js"></script>
    <script type="text/babel" src="components/workspace/Header.js"></script>
    <script type="text/babel" src="components/workspace/Sidebar.js"></script>
    <script type="text/babel" src="components/workspace/MissionCard.js"></script>
    <script type="text/babel" src="components/workspace/AIChat.js"></script>
    <script type="text/babel" src="components/workspace/Sketch.js"></script>
    <script type="text/babel" src="workspace-app.js"></script>
</body>
</html>
